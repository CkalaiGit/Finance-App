server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Fallback SPA : les routes profondes (/watchlist, /details/AAPL) renvoient index.html
    # Cache-Control no-cache : le navigateur revalide index.html à chaque chargement
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Fichiers hashés par Angular (outputHashing: all) : cache long et immuable
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
